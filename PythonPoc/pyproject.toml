[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earthtrends"
version = "0.1.0"
description = "Trend Detective core: NASA Earth science data, polygon time series, trend significance"
requires-python = ">=3.11"
dependencies = [
    "earthaccess>=0.11",
    "xarray>=2024.6",
    "netCDF4>=1.7",
    "zarr>=2.18",
    "dask>=2024.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "shapely>=2.0",
    "pymannkendall>=1.4.3",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",   # random forest for cause analysis
    "anthropic>=2.0",      # AI explanations (optional at runtime: needs ANTHROPIC_API_KEY)
]

[tool.setuptools]
packages = ["earthtrends"]
